version: "3.9"

services:
  # =========================
  # LAYER 3 - RAW STORAGE
  # =========================
  # --- MinIO (S3 compatible object storage) ---
  minio:
    image: minio/minio:latest
    container_name: minio
    hostname: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Create buckets: lake (raw zone + dvc remote) & iot-time-series (exercise batch)
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123} &&
      mc mb -p local/lake || true &&
      mc mb -p local/iot-time-series || true &&
      mc mb -p local/dvcstore || true &&
      mc anonymous set none local/lake || true &&
      mc anonymous set none local/iot-time-series || true &&
      mc anonymous set none local/dvcstore || true &&
      echo '✅ Buckets ready: lake, iot-time-series, dvcstore' &&
      exit 0
      "

  # =========================
  # (Optional) METADATA + QUERY (kept from original exercise)
  # =========================
  metastore-db:
    image: postgres:17
    container_name: metastore-db
    hostname: metastore-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive_password
    ports:
      - "5432:5432"
    volumes:
      - metastore_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 20

  hms-schema-init:
    image: starburstdata/hive:3.1.2-e.18
    container_name: hms-schema-init
    depends_on:
      metastore-db:
        condition: service_healthy
    environment:
      HIVE_METASTORE_DRIVER: org.postgresql.Driver
      HIVE_METASTORE_JDBC_URL: jdbc:postgresql://metastore-db:5432/metastore
      HIVE_METASTORE_USER: hive
      HIVE_METASTORE_PASSWORD: hive_password
      # MinIO / S3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      S3_PATH_STYLE_ACCESS: "true"
      REGION: ""
      GOOGLE_CLOUD_KEY_FILE_PATH: ""
      AZURE_ADL_CLIENT_ID: ""
      AZURE_ADL_CREDENTIAL: ""
      AZURE_ADL_REFRESH_URL: ""
      AZURE_ABFS_STORAGE_ACCOUNT: ""
      AZURE_ABFS_ACCESS_KEY: ""
      AZURE_WASB_STORAGE_ACCOUNT: ""
      AZURE_ABFS_OAUTH: ""
      AZURE_ABFS_OAUTH_TOKEN_PROVIDER: ""
      AZURE_ABFS_OAUTH_CLIENT_ID: ""
      AZURE_ABFS_OAUTH_SECRET: ""
      AZURE_ABFS_OAUTH_ENDPOINT: ""
      AZURE_WASB_ACCESS_KEY: ""
    entrypoint: >
      /bin/bash -lc "
      schematool -dbType postgres -initSchema --verbose || true;
      exit 0
      "

  hive-metastore:
    image: starburstdata/hive:3.1.2-e.18
    container_name: hive-metastore
    hostname: hive-metastore
    restart: unless-stopped
    ports:
      - "9083:9083"
    environment:
      HIVE_METASTORE_DRIVER: org.postgresql.Driver
      HIVE_METASTORE_JDBC_URL: jdbc:postgresql://metastore-db:5432/metastore
      HIVE_METASTORE_USER: hive
      HIVE_METASTORE_PASSWORD: hive_password
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      S3_PATH_STYLE_ACCESS: "true"
      REGION: ""
      GOOGLE_CLOUD_KEY_FILE_PATH: ""
      AZURE_ADL_CLIENT_ID: ""
      AZURE_ADL_CREDENTIAL: ""
      AZURE_ADL_REFRESH_URL: ""
      AZURE_ABFS_STORAGE_ACCOUNT: ""
      AZURE_ABFS_ACCESS_KEY: ""
      AZURE_WASB_STORAGE_ACCOUNT: ""
      AZURE_ABFS_OAUTH: ""
      AZURE_ABFS_OAUTH_TOKEN_PROVIDER: ""
      AZURE_ABFS_OAUTH_CLIENT_ID: ""
      AZURE_ABFS_OAUTH_SECRET: ""
      AZURE_ABFS_OAUTH_ENDPOINT: ""
      AZURE_WASB_ACCESS_KEY: ""
    depends_on:
      metastore-db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      hms-schema-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -lc '</dev/tcp/localhost/9083'"]
      interval: 10s
      timeout: 5s
      retries: 30

  trino-coordinator:
    image: trinodb/trino:470
    container_name: trino-coordinator
    hostname: trino-coordinator
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./trino/coordinator/etc:/etc/trino:ro
    depends_on:
      hive-metastore:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  trino-worker:
    image: trinodb/trino:470
    container_name: trino-worker
    hostname: trino-worker
    restart: unless-stopped
    depends_on:
      trino-coordinator:
        condition: service_healthy
    volumes:
      - ./trino/worker/etc:/etc/trino:ro

  # =========================
  # LAYER 1 - SOURCE SYSTEMS (OLTP)
  # =========================
  # Debezium Postgres image enables logical decoding by default
  cdc-postgres:
    image: debezium/postgres:15
    container_name: cdc-postgres
    hostname: cdc-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"   # map to host 5433 to avoid conflict with metastore-db
    environment:
      POSTGRES_USER: dbz
      POSTGRES_PASSWORD: dbz
      POSTGRES_DB: inventory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbz -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Seed OLTP table + data for CDC
  cdc-seed:
    image: postgres:17
    container_name: cdc-seed
    depends_on:
      cdc-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: dbz
    volumes:
      - ./scripts/cdc_bootstrap.sql:/cdc_bootstrap.sql:ro
    entrypoint: >
      bash -lc "
      psql -h cdc-postgres -U dbz -d inventory -f /cdc_bootstrap.sql &&
      echo '✅ CDC source table ready' &&
      exit 0
      "

  # =========================
  # LAYER 2 - INGESTION (CDC via Kafka)
  # =========================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.1
    container_name: cdc-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.2.1
    container_name: cdc-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  connect:
    image: debezium/connect:2.5
    container_name: cdc-connect
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_started
      cdc-postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: "1"
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Auto-register Debezium connector (so you don't need to curl manually)
  connector-init:
    image: curlimages/curl:8.6.0
    container_name: cdc-connector-init
    depends_on:
      connect:
        condition: service_healthy
      cdc-seed:
        condition: service_completed_successfully
    volumes:
      - ./scripts/register_connector.json:/register_connector.json:ro
    entrypoint: >
      sh -lc "
      echo '⏳ Registering Debezium connector...' &&
      curl -s -o /dev/null -w '%{http_code}\n' -X POST http://connect:8083/connectors
      -H 'Content-Type: application/json'
      -d @/register_connector.json | grep -E '^(201|409)$' &&
      echo '✅ Connector registered (201 created / 409 already exists)' &&
      exit 0
      "

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cdc-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_started
      connect:
        condition: service_healthy
    ports:
      - "8081:8080"   # avoid conflict with Trino 8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083

networks:
  default:
    name: infra_datalake

volumes:
  minio_data:
  metastore_db_data:
